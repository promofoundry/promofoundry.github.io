<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ethan &amp; Sophia · මංගල ආරාධනය</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ethan &amp; Sophia · මංගල ආරාධනය">
    <meta property="og:description" content="ඔබට ආරාධනා ✨ ඔබේ ආරාධනය විවෘත කිරීමට තට්ටු කරන්න">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        :root{
            --outer:#e7dfcf;--ivory:#fbf6ec;--cream:#f3ecdb;--sage:#7c9a6b;--deep:#34452f;--gold:#b08d4c;--ink:#4a4a3d;
            --w:min(100vw,520px);
            box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
        }
        @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--outer:#14110e}}
        :root[data-theme="dark"]{--outer:#14110e}
        *,*::before,*::after{box-sizing:inherit}
        html{scroll-behavior:smooth}
        body{margin:0;background:var(--outer);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;
            -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
        body.locked{overflow:hidden;height:100dvh}
        .col{width:var(--w);margin:0 auto;background:var(--ivory);position:relative}
        /* HERO */
        .hero{position:relative;width:100%;height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#e9e1d3;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
        .hero .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.95);transform:scale(1.1)}
        .stage{position:relative;height:min(100dvh,calc(var(--w)*16/9));aspect-ratio:9/16;overflow:hidden;background:#e9e1d3}
        .stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
        .stage video{opacity:0;transition:opacity .15s linear}
        .stage.playing video{opacity:1}
        .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 55%,rgba(60,45,25,.28) 100%);transition:opacity .4s}
        .shim{position:absolute;left:50%;top:48%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;overflow:hidden;
            -webkit-mask-image:radial-gradient(circle,#000 55%,transparent 72%);mask-image:radial-gradient(circle,#000 55%,transparent 72%);transition:opacity .3s}
        .shim::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-12deg);animation:sweep 4.2s ease-in-out infinite}
        @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
        .tap{position:absolute;left:0;right:0;text-align:center;bottom:calc(env(safe-area-inset-bottom,0px) + 7dvh);
            font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(17px,4.6dvh,26px);letter-spacing:.32em;text-indent:.32em;color:#fbf6ec;
            text-shadow:0 1px 10px rgba(40,28,12,.55);animation:pulse 2.8s ease-in-out infinite;transition:opacity .3s}
        @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
        .stage.opened .tap,.stage.opened .vig,.stage.opened .shim{opacity:0;animation:none}
        .chev{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3dvh);width:26px;height:26px;margin-left:-13px;opacity:0;pointer-events:none;transition:opacity .8s}
        .stage.done .chev{opacity:.9;animation:bob 1.8s ease-in-out infinite}
        @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
        .chev path{stroke:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
        .mbtn{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,calc(50% - var(--w)/2 + 14px));width:44px;height:44px;border-radius:50%;border:1px solid rgba(176,141,76,.7);
            background:rgba(251,246,236,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:0;cursor:pointer;
            opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .6s,transform .6s;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
        body.opened .mbtn{opacity:1;pointer-events:auto;transform:none}
        .mbtn svg{width:20px;height:20px;stroke:#34452f;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .mbtn .off{display:none}.mbtn.muted .on{display:none}.mbtn.muted .off{display:block}
        .mbtn:not(.muted)::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(176,141,76,.6);animation:ring 2.4s ease-out infinite}
        @keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.55);opacity:0}}
        /* SECTIONS */
        section{padding:84px 28px;text-align:center;position:relative;overflow:hidden}
        .alt{background:var(--cream)}
        .eyebrow{font-family:"Cormorant Garamond",serif;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;font-size:13px;color:var(--gold);margin:0 0 18px}
        h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:34px;color:var(--deep);margin:0 0 10px;line-height:1.15}
        p{line-height:1.8;margin:0 0 14px;font-size:15.5px}
        .orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:22px auto;font-size:14px}
        .orn::before,.orn::after{content:"";width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
        .orn::after{transform:scaleX(-1)}
        .arch{width:88%;aspect-ratio:646/935;margin:0 auto 38px;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(52,69,47,.55);border:6px solid #fff;background:#e9e1d3}
        .arch img{width:100%;height:100%;object-fit:cover;display:block}
        .names{font-family:"Pinyon Script",cursive;font-size:56px;line-height:1.05;color:var(--deep);margin:6px 0}
        .names small{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--gold);margin:4px 0;font-style:italic}
        .date{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--deep);letter-spacing:.06em;margin-top:6px}
        .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px}
        .cd div{background:#fff;border:1px solid rgba(176,141,76,.35);border-radius:14px;padding:16px 4px}
        .cd b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:34px;color:var(--deep);line-height:1}
        .cd span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
        .ev{background:#fff;border-radius:18px;padding:30px 22px;margin-top:18px;box-shadow:0 10px 30px -18px rgba(52,69,47,.4);border-top:3px solid var(--sage)}
        .ev h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:27px;margin:0 0 8px;color:var(--deep)}
        .ev .t{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;margin-bottom:10px}
        .ev p{margin:0;font-size:14.5px}
        .btn{display:inline-block;margin:8px 5px 0;padding:15px 30px;border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.2em;text-transform:uppercase;transition:transform .25s,box-shadow .25s}
        .btn.p{background:var(--deep);color:#fbf6ec;box-shadow:0 10px 22px -10px rgba(52,69,47,.8)}
        .btn.o{border:1px solid var(--deep);color:var(--deep)}
        .btn:active{transform:scale(.97)}
        .venue{font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--deep);margin:4px 0}
        footer{padding:64px 28px calc(64px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--deep);color:#e9e2cf}
        footer .names{color:#fbf6ec;font-size:46px}
        footer p{color:#c9c2a8;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
        .rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
        .rv.in{opacity:1;transform:none}
        .petal{position:absolute;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;background:rgba(236,176,170,.55);animation:fall linear infinite;pointer-events:none}
        @keyframes fall{to{transform:translateY(900px) rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.petal,.shim::after,.tap,.stage.done .chev,.mbtn::after{animation:none}}
    </style>
</head>
